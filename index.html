<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farmer Details Form</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      background-color: #f8f9fa;
    }

    header {
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .logo img {
      max-height: 70px;
    }

    .header-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
    }

    .form-section {
      margin-top: 2rem;
    }

    .table th {
      position: sticky;
      top: 0;
      background-color: #343a40;
      color: white;
      z-index: 1;
    }

    .btn i {
      margin-right: 5px;
    }

    .footer-marquee {
      font-weight: bold;
      color: yellow;
    }
  </style>
</head>

<body>
  <header class="border-bottom">
    <div class="container header-wrapper">
      <div class="logo">
        <a href="#"><img src="logo1.png" alt="Company Logo" /></a>
      </div>

      <div class="text-center">
        <h2 class="text-danger mb-1">Star Agro Tech Pvt Ltd®</h2>
        <p class="text-muted">Production Area: Eluru | Season: Rabi 2023–2024</p>
      </div>

      <div class="logo">
        <a href="#"><img src="trade-3.png" alt="Trade Logo" /></a>
      </div>
    </div>
  </header>

  <main class="container form-section">
    <!-- Organizer Info -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 class="card-title mb-3 text-primary">Organizer & Area Details</h5>
        <div class="row g-3">
          <div class="col-md-4">
            <label for="organizer" class="form-label">Organizer</label>
            <input type="text" class="form-control" id="organizer" />
          </div>
          <div class="col-md-4">
            <label for="village" class="form-label">Village</label>
            <input type="text" class="form-control" id="village" />
          </div>
          <div class="col-md-4">
            <label for="variety" class="form-label">Variety</label>
            <input type="text" class="form-control" id="variety" />
          </div>
          <div class="col-md-4">
            <label for="areaIncharge" class="form-label">Area Incharge</label>
            <input type="text" class="form-control" id="areaIncharge" />
          </div>
          <div class="col-md-4">
            <label for="district" class="form-label">District</label>
            <input type="text" class="form-control" id="district" />
          </div>
          <div class="col-md-4">
            <label for="mandal" class="form-label">Mandal</label>
            <input type="text" class="form-control" id="mandal" />
          </div>
        </div>
      </div>
    </div>

    <!-- Farmer Table -->
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title text-primary mb-3">Farmer Details Table</h5>
        <div class="table-responsive">
          <table class="table table-bordered table-hover align-middle text-center" id="myTable">
            <thead class="table-dark">
              <tr>
                <th>S.No</th>
                <th>Farmer Name</th>
                <th>F. Date</th>
                <th>M. Date</th>
                <th>Packets</th>
                <th>Std Acres</th>
                <th>Female KG</th>
                <th>Male KG</th>
                <th>Phone</th>
                <th>Remark</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="SNO">1</td>
                <td><input type="text" class="form-control" /></td>
                <td><input type="date" class="form-control" /></td>
                <td><input type="date" class="form-control" /></td>
                <td><input type="number" class="form-control" /></td>
                <td><input type="number" class="form-control" /></td>
                <td><input type="number" class="form-control" /></td>
                <td><input type="number" class="form-control" /></td>
                <td><input type="tel" class="form-control" /></td>
                <td><input type="text" class="form-control" /></td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Buttons -->
        <div class="d-flex justify-content-center flex-wrap gap-3 mt-4">
          <button type="button" class="btn btn-success" id="saveData">
            <i class="bi bi-save"></i>Save
          </button>
          <button type="button" class="btn btn-primary" id="print">
            <i class="bi bi-printer"></i>Print
          </button>
          <button type="button" class="btn btn-secondary" id="addRow">
            <i class="bi bi-plus-circle"></i>Add Row
          </button>
        </div>
      </div>
    </div>

    <!-- Load/Save Area -->
    <div id="savedPdfs" class="container my-4 border-top pt-3"></div>
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-white py-3 text-center mt-5">
    <marquee class="footer-marquee">This is a computer-generated sheet. Please remember to Save!</marquee>
  </footer>

  <!-- Bootstrap & JS -->
  <script type="module" src="script.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.13/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Optional Icons (Bootstrap Icons CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
</body>

</html>
