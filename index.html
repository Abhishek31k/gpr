<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Farmer Details Form</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <style>
    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background-color: var(--bs-dark);
      color: white;
    }

    @media print {
      header,
      .btn,
      footer,
      #toggleDarkMode,
      #savedPdfs {
        display: none !important;
      }

      body {
        background-color: white;
        color: black;
      }

      .table {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <header class="bg-light py-3 border-bottom">
    <div class="container d-flex justify-content-between align-items-center flex-wrap">
      <div>
        <a href="#">
          <img src="logo1.png" alt="Logo" style="width: 90px" />
        </a>
      </div>
      <div class="text-center flex-grow-1 px-3">
        <h1 class="h4 mb-2">
          <span class="text-danger">Star Agro tech Pvt Ltd®</span><br />
          Production Area Eluru, Season Rabi 2023 - 2024
        </h1>
        <div class="row g-2">
          <div class="col-md-4">
            <label class="form-label">Organizer</label>
            <input type="text" id="organizer" class="form-control" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Village</label>
            <input type="text" id="village" class="form-control" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Variety</label>
            <input type="text" id="variety" class="form-control" />
          </div>
          <div class="col-md-4 mt-2">
            <label class="form-label">Area Incharge</label>
            <input type="text" id="areaIncharge" class="form-control" />
          </div>
          <div class="col-md-4 mt-2">
            <label class="form-label">District</label>
            <input type="text" id="district" class="form-control" />
          </div>
          <div class="col-md-4 mt-2">
            <label class="form-label">Mandal</label>
            <input type="text" id="mandal" class="form-control" />
          </div>
        </div>
      </div>
      <div>
        <a href="#">
          <img src="trade-3.png" alt="Logo" style="width: 70px" />
        </a>
      </div>
    </div>
  </header>

  <main class="container my-4">
    <!-- Dark Mode Toggle -->
    <div class="d-flex justify-content-end mb-3">
      <button class="btn btn-outline-dark" id="toggleDarkMode">
        <i class="bi bi-moon-stars"></i> Toggle Dark Mode
      </button>
    </div>

    <!-- Search Box -->
    <div class="mb-3">
      <input type="text" class="form-control" id="searchBox" placeholder="Search by Farmer Name or Phone…" />
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-2">
        <form>
          <div class="table-responsive">
            <table class="table table-bordered text-center align-middle mb-0" id="myTable">
              <thead class="table-dark">
                <tr>
                  <th>S.No</th>
                  <th>Farmer Name</th>
                  <th>F.Date</th>
                  <th>M.Date</th>
                  <th>Packets</th>
                  <th>Std Acres</th>
                  <th>Female KG</th>
                  <th>Male KG</th>
                  <th>Phone Number</th>
                  <th>Remark</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td class="SNO">1</td>
                  <td><input type="text" class="form-control" /></td>
                  <td><input type="date" class="form-control" /></td>
                  <td><input type="date" class="form-control" /></td>
                  <td><input type="number" class="form-control" /></td>
                  <td><input type="number" class="form-control" /></td>
                  <td><input type="number" class="form-control" /></td>
                  <td><input type="number" class="form-control" /></td>
                  <td><input type="tel" class="form-control" /></td>
                  <td><input type="text" class="form-control" /></td>
                  <td></td>
                </tr>
              </tbody>
            </table>
          </div>

          <div
            class="d-flex justify-content-center flex-wrap gap-3 mt-3"
            style="gap: 1rem !important"
          >
            <button type="button" class="btn btn-success" id="saveData">
              <i class="bi bi-save"></i> Save
            </button>
            <button type="button" class="btn btn-primary" id="print">
              <i class="bi bi-printer"></i> Print
            </button>
            <button type="button" class="btn btn-secondary" id="addRow">
              <i class="bi bi-plus-circle"></i> Add Row
            </button>
            <button type="button" class="btn btn-info" id="exportExcel">
              <i class="bi bi-file-earmark-excel"></i> Export Excel
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white py-3 mt-4">
    <div class="container text-center">
      <marquee>This is a Computer Generated Sheet. Always Save!</marquee>
    </div>
  </footer>

  <div id="savedPdfs" class="container my-4 border-top pt-3"></div>

  <!-- Toast Container -->
  <div
    class="position-fixed bottom-0 end-0 p-3"
    style="z-index: 9999"
  >
    <div
      id="liveToast"
      class="toast align-items-center text-white bg-success border-0"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
    >
      <div class="d-flex">
        <div class="toast-body" id="toastMsg">Saved successfully!</div>
        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          data-bs-dismiss="toast"
          aria-label="Close"
        ></button>
      </div>
    </div>
  </div>

  <!-- External Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.13/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- Your custom script -->
  <script type="module" src="script.js"></script>
</body>

</html>
